name: Jobscout

on:
  schedule:
    - cron: "0 6 * * *"   # naponta 06:00 UTC (08:00 nyáron, 07:00 télen Budapesten)
  workflow_dispatch:       # kézi indítás az Actions fülről

permissions:
  contents: write          # a jobscout_seen.json visszacommitolásához kell

concurrency:
  group: jobscout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repo letöltése
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Állásfigyelő futtatása
        run: python jobscout.py --no-open

      - name: Jelentés mentése letölthető fájlként
        uses: actions/upload-artifact@v4
        with:
          name: jobscout-report
          path: jobscout_report.html
          retention-days: 30

      - name: Látott állások állapotának visszamentése a repóba
        run: |
          git config user.name "jobscout-bot"
          git config user.email "jobscout-bot@users.noreply.github.com"
          git add jobscout_seen.json
          if git diff --cached --quiet; then
            echo "Nincs változás."
          else
            git commit -m "jobscout: látott állások frissítése [skip ci]"
            git push
          fi
